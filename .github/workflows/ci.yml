on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
        # Go's GOTMPDIR uses the directory verbatim and does
        # NOT create it — the directory must exist before
        # `go test` runs. The local sandbox also mounts /tmp
        # as a noexec tmpfs, so GOTMPDIR redirects Go's
        # build/test temp dir to a writable, exec-capable path.
        # Matches the local validation command in the PR
        # description.
          GOTMPDIR: /tmp/agentctl-test
        run: mkdir -p "$GOTMPDIR" && go test -race ./...

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Scan for secrets
        run: gitleaks git --redact --verbose
